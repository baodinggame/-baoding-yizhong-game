<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183b58">
<title>保定一中假期保卫战</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#102c46,#28627b);color:#f7fbff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh}
main{width:min(1000px,96vw);margin:auto;padding:22px 0 38px}
header{text-align:center;margin-bottom:16px}h1{font-size:clamp(25px,5vw,42px);margin:4px 0;color:#ffe28a;text-shadow:0 3px 0 #794d2a}header p{margin:6px 0;color:#d4e8f2}
.panel{background:#f7f2e6;color:#203448;border:4px solid #d4ad68;border-radius:18px;padding:14px;box-shadow:0 12px 30px #071a2c88}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.stat{background:#e5edf0;border-radius:10px;padding:8px 12px;font-weight:700}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:2px solid #9c8157;background:#a9dff5;touch-action:none}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:11px 16px;background:#d74c3f;color:white;font-weight:800;font-size:15px;cursor:pointer}button.secondary{background:#315c72}button:disabled{opacity:.45;cursor:not-allowed}
#message{font-weight:700;min-height:28px;margin:10px 2px 0}.hint{font-size:13px;color:#526779;line-height:1.6}
#nextPanel{display:none;text-align:center;background:#fff3c8;border-radius:14px;padding:15px;margin-top:12px}#nextPanel h2{margin:0 0 6px;color:#8d4b1d}
footer{text-align:center;color:#c5dce8;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<main>
<header><h1>🐦 保定一中假期保卫战</h1><p>校园主题弹射闯关小游戏 · 第一章：校门夺还战</p></header>
<section class="panel">
 <div class="hud">
  <div class="stat" id="chapterLabel">🏫 第一章：校门夺还战</div>
  <div class="stat">⭐ 得分：<span id="score">0</span></div>
  <div class="stat">🐦 剩余小鸟：<span id="birds">3</span></div>
 </div>
 <canvas id="game" width="960" height="540" aria-label="弹弓闯关游戏画面"></canvas>
 <div id="message" aria-live="polite">拖动弹弓上的红色小鸟，向后拉动后松手发射！击败绿猪BOSS即可通关。</div>
 <div class="controls">
  <button id="fire" disabled>发射小鸟</button>
  <button class="secondary" id="restart">重新开始</button>
 </div>
 <p class="hint">操作说明：用鼠标或手指按住红色小鸟，向左或向下拖动蓄力，松开即可发射。撞击木架和绿猪可以得分。共有 3 只小鸟。</p>
 <div id="nextPanel"><h2>🏆 校门夺还成功！</h2><p>绿猪BOSS已被击败，保定一中校门重新夺回！</p><strong>下一站：第二章 · 教学楼反击战</strong><br><button id="next" style="margin-top:10px">进入第二章 ➜</button></div>
</section>
<footer>本页面为校园主题原创同人小游戏概念作品，与学校官方无关。</footer>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=540,ground=455,sling={x:170,y:365};
const $=id=>document.getElementById(id);
let birds=[],blocks=[],pigs=[],particles=[],score=0,active=null,drag=false,won=false,lost=false,raf=0,last=0,chapter=1;
function makeBird(){return{x:sling.x,y:sling.y,r:19,vx:0,vy:0,flying:false,used:false}}
function reset(){
 cancelAnimationFrame(raf);score=0;won=false;lost=false;drag=false;active=null;particles=[];
 birds=[makeBird(),makeBird(),makeBird()];
 blocks=[
 {x:650,y:405,w:30,h:100,hp:2},{x:820,y:405,w:30,h:100,hp:2},
 {x:735,y:350,w:200,h:24,hp:2},{x:700,y:305,w:28,h:65,hp:2},
 {x:800,y:305,w:28,h:65,hp:2},{x:750,y:270,w:130,h:22,hp:2}
 ];
 pigs=[{x:750,y:425,r:23,hp:2,boss:false},{x:750,y:240,r:30,hp:chapter===1?5:7,boss:true}];
 $('nextPanel').style.display='none';$('message').textContent='拖动弹弓上的红色小鸟，向后拉动后松手发射！';
 $('chapterLabel').textContent=chapter===1?'🏫 第一章：校门夺还战':'🏫 第二章：教学楼反击战';
 update();draw();last=0;raf=requestAnimationFrame(loop);
}
function update(){$('score').textContent=score;$('birds').textContent=birds.filter(b=>!b.used).length;$('fire').disabled=!(active&&drag);}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{
 if(won||lost)return;const p=pos(e),b=birds.find(x=>!x.used&&!x.flying);
 if(b&&Math.hypot(p.x-b.x,p.y-b.y)<45){active=b;drag=true;canvas.setPointerCapture(e.pointerId)}
});
canvas.addEventListener('pointermove',e=>{
 if(!drag||!active)return;const p=pos(e);let dx=p.x-sling.x,dy=p.y-sling.y,d=Math.hypot(dx,dy);
 if(d>100){dx*=100/d;dy*=100/d}active.x=sling.x+dx;active.y=sling.y+dy;draw();update();
});
canvas.addEventListener('pointerup',fire);canvas.addEventListener('pointercancel',fire);
function fire(){
 if(!drag||!active)return;drag=false;const b=active,dx=sling.x-b.x,dy=sling.y-b.y;
 if(Math.hypot(dx,dy)<12){b.x=sling.x;b.y=sling.y;active=null;draw();update();return}
 b.vx=dx*.19;b.vy=dy*.19;b.flying=true;b.used=true;active=null;
 $('message').textContent='小鸟出击！看看能否击中BOSS！';update();
}
$('fire').onclick=fire;$('restart').onclick=()=>{chapter=1;reset()};
$('next').onclick=()=>{chapter=2;reset();$('message').textContent='第二章开始！教学楼的新防线正在等待挑战。'};
function burst(x,y,color){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,t:35,color})}
function collide(b){
 blocks.forEach(o=>{if(o.hp>0&&b.x+b.r>o.x&&b.x-b.r<o.x+o.w&&b.y+b.r>o.y&&b.y-b.r<o.y+o.h){o.hp--;score+=100;b.vx*=.62;b.vy*=-.4;burst(b.x,b.y,'#b77b43')}});
 pigs.forEach(p=>{if(p.hp>0&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){p.hp--;score+=p.boss?500:250;b.vx*=.5;b.vy*=-.35;burst(p.x,p.y,'#65bd50')}});
}
function loop(t){const dt=Math.min((t-last)/16.67||1,2);last=t;
 birds.forEach(b=>{if(!b.flying)return;b.vy+=.36*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.995;
 if(b.y+b.r>ground){b.y=ground-b.r;b.vy*=-.28;b.vx*=.76}collide(b);
 if(b.x>W+80||b.y>H+80||(Math.hypot(b.vx,b.vy)<.7&&b.y>=ground-b.r-2))b.flying=false;
 });
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.t--});particles=particles.filter(p=>p.t>0);
 if(!won&&pigs.every(p=>p.hp<=0)){won=true;$('message').textContent='🎉 BOSS被击败！本章通关！';$('nextPanel').style.display='block'}
 if(!won&&birds.every(b=>b.used&&!b.flying)&&!lost){lost=true;$('message').textContent='小鸟用完了！点击“重新开始”再挑战一次。'}
 update();draw();raf=requestAnimationFrame(loop);
}
function draw(){
 ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83cef2');sky.addColorStop(1,'#e8f3d9');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff';[[100,85],[360,110],[840,80]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+28,y-8,30,0,7);ctx.arc(x+55,y,23,0,7);ctx.fill()});
 ctx.fillStyle='#6da95b';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#477e42';ctx.fillRect(0,ground,W,9);
 // 校门背景
 ctx.fillStyle='#d9d1bb';ctx.fillRect(545,205,360,250);ctx.fillStyle='#a8493d';ctx.fillRect(530,188,390,22);
 ctx.fillStyle='#fff0ce';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('保定一中',725,235);
 ctx.fillStyle='#52677d';ctx.fillRect(610,270,90,185);ctx.fillRect(755,270,90,185);
 ctx.strokeStyle='#d4b58a';ctx.lineWidth=6;for(let x=625;x<700;x+=20){ctx.beginPath();ctx.moveTo(x,270);ctx.lineTo(x,455);ctx.stroke()}
 // 弹弓
 ctx.strokeStyle='#81512b';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(145,450);ctx.lineTo(170,350);ctx.lineTo(195,450);ctx.stroke();
 ctx.strokeStyle='#e8c28a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(170,350);ctx.lineTo(active&&drag?active.x:170,active&&drag?active.y:365);ctx.stroke();
 blocks.forEach(o=>{if(o.hp<=0)return;ctx.fillStyle='#b9824b';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#70472b';ctx.lineWidth=3;ctx.strokeRect(o.x,o.y,o.w,o.h)});
 pigs.forEach(p=>{if(p.hp<=0)return;ctx.fillStyle='#59bd4d';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(p.x-10,p.y-7,6,0,7);ctx.arc(p.x+10,p.y-7,6,0,7);ctx.fill();
 ctx.fillStyle='#253b28';ctx.beginPath();ctx.arc(p.x-10,p.y-7,2.5,0,7);ctx.arc(p.x+10,p.y-7,2.5,0,7);ctx.fill();
 ctx.fillStyle='#a3e28d';ctx.beginPath();ctx.ellipse(p.x,p.y+8,12,8,0,0,7);ctx.fill();
 ctx.fillStyle='#263a28';ctx.font='bold 13px sans-serif';ctx.fillText(p.boss?'BOSS '+p.hp+' HP':p.hp+' HP',p.x,p.y-p.r-8)});
 birds.forEach(b=>{if(b.used&&!b.flying)return;ctx.fillStyle='#e43d35';ctx.beginPath();ctx.arc(b.x,b.y,19,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(b.x+6,b.y-5,6,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(b.x+8,b.y-5,2.5,0,7);ctx.fill();ctx.fillStyle='#f4bd3f';ctx.beginPath();ctx.moveTo(b.x+15,b.y);ctx.lineTo(b.x+29,b.y+5);ctx.lineTo(b.x+15,b.y+8);ctx.fill()});
 particles.forEach(p=>{ctx.globalAlpha=p.t/35;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,7,7);ctx.globalAlpha=1});
 if(won){ctx.fillStyle='#15352bcc';ctx.fillRect(240,160,480,130);ctx.fillStyle='white';ctx.font='bold 34px sans-serif';ctx.fillText('本章完美通关！',480,215);ctx.font='20px sans-serif';ctx.fillText('校门已夺回！',480,255)}
}
reset();
})();
</script>
</body>
</html>
